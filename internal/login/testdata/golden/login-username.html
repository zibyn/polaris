<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · Polaris</title>
<style>
 
:root {
  --primary: #7048e8; --primary-hover: #5f37d6; --primary-soft: #f5f0ff; --primary-ink: #6236d9; --primary-foreground: #fff;
  --star: #f0609e; --nebula: #b197fc; --canvas: #f7f4fa; --panel: #fff;
  --ink: #211b2c; --muted: #6e677d; --faint: #a8a1b6; --line: #efebf4; --danger: #d33;
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  font: 14px/1.5 Inter, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--ink); background: var(--panel); color-scheme: light; -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
 
[hidden] { display: none !important; }
::selection { background: var(--primary-soft); color: var(--ink); }
body { margin: 0; min-height: 100svh; display: grid; grid-template-columns: 1fr 1fr; }
.brand { position: relative; overflow: hidden; background: var(--primary-soft); padding: 48px; }
 
.brand .glow { transform-box: fill-box; transform-origin: center; animation: settle 1.4s var(--ease-out) both; }
.brand .glow + .glow { animation-delay: .18s; }
@keyframes settle { from { opacity: 0; transform: scale(1.07); } }
.brand > div { position: relative; display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 600; }
.brand .sky { position: absolute; inset: 0; width: 100%; height: 100%; }
.star { fill: var(--star); width: 24px; height: 24px; }
.form { display: grid; place-items: center; padding: 56px 32px; }
 
main { width: 100%; max-width: 340px; animation: rise .42s var(--ease-out) both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
main > .star { width: 32px; height: 32px; }
h1 { margin: 24px 0 0; font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
h1 + p { margin-top: 4px; }
p { color: var(--muted); margin: 16px 0; }
form p { margin: 0; }
p b { color: var(--ink); font-weight: 500; }
form { display: grid; gap: 16px; margin-top: 32px; }
label { display: grid; gap: 4px; font-size: 13px; font-weight: 500; }
input, button { font: inherit; font-size: 14px; color: inherit; border-radius: 8px; }
input:not([type=checkbox]) {
  padding: 9px 12px; border: 1px solid var(--line); outline: none; background: var(--panel);
  transition: border-color .15s, box-shadow .2s var(--ease-out);
}
input:not([type=checkbox]):focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 16%, transparent); }
 
input:-webkit-autofill { -webkit-box-shadow: 0 0 0 100px var(--panel) inset; -webkit-text-fill-color: var(--ink); }
 
input[name=code], input[name=totp] { letter-spacing: .3em; font-variant-numeric: tabular-nums; }
button {
  cursor: pointer; padding: 10px 12px; font-weight: 500; border: 0; background: var(--primary); color: var(--primary-foreground);
  transition: background-color .15s, color .15s, border-color .15s, transform .1s;
}
button:not(:disabled):active { transform: translateY(1px); }
button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
button:hover { background: var(--primary-hover); }
a { color: var(--primary-ink); }
form > a { font-size: 13px; justify-self: start; text-decoration: none; }
form > a:hover { text-decoration: underline; }
 
form > button.resend { justify-self: start; padding: 0; background: transparent; color: var(--primary-ink); font-size: 13px; font-weight: 400; }
form > button.resend:hover { background: transparent; text-decoration: underline; }
form > button.resend:disabled { color: var(--faint); text-decoration: none; cursor: default; }
.wait { color: var(--faint); font-variant-numeric: tabular-nums; }
 
.field-group { display: grid; gap: 4px; font-size: 13px; font-weight: 500; }
.field { position: relative; display: block; }
.field input { width: 100%; padding-inline-end: 56px; }
.field button.reveal { position: absolute; inset-block: 2px; inset-inline-end: 2px; min-height: 0; padding: 0 8px; border-radius: 6px; background: transparent; color: var(--primary-ink); font-size: 12px; font-weight: 500; }
.field button.reveal:hover { background: var(--primary-soft); }
.field button.reveal:focus-visible { outline-offset: -2px; }
.who { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 8px; background: var(--canvas); overflow-wrap: anywhere; }
.who a { font-size: 13px; flex: none; }
.error { color: var(--danger); font-size: 13px; }
label.agree { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; font-weight: 400; color: var(--muted); }
label.agree a { text-decoration: none; }
label.agree input { margin: 3px 0 0; accent-color: var(--primary); }
altcha-widget { --altcha-border-radius: 8px; --altcha-color-border: var(--line); --altcha-max-width: 100%; }
 
.or { display: flex; align-items: center; gap: 12px; margin: 24px 0 16px; font-size: 12px; color: var(--faint); }
.or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
form.providers { margin-top: 8px; gap: 8px; }
.or + form.providers { margin-top: 0; }
button#passkey-login { display: block; width: 100%; background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
button#passkey-login:hover { background: var(--canvas); }
form.providers button { background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
form.providers button:hover { background: var(--canvas); }
 
form.providers button.apple, form.providers button.google, form.providers button.microsoft, form.providers button.github, form.providers button.dingtalk, form.providers button.wecom, form.providers button.feishu { display: flex; align-items: center; justify-content: center; gap: 8px; }
form.providers button.google svg, form.providers button.microsoft svg, form.providers button.github svg, form.providers button.dingtalk svg, form.providers button.wecom svg, form.providers button.feishu svg { width: 18px; height: 18px; flex: none; }
 
form.providers button.apple, form.providers button.apple:hover { gap: 6px; background: #000; color: #fff; border-color: #000; }
form.providers button.apple svg { width: 15px; height: 15px; fill: currentColor; margin-top: -2px; }
 
form.providers button.google { border-color: #747775; color: #1f1f1f; gap: 10px; }
 
form.providers button.microsoft { border-color: #8c8c8c; color: #5e5e5e; }
form.providers button.google:hover, form.providers button.microsoft:hover, form.providers button.github:hover, form.providers button.dingtalk:hover, form.providers button.wecom:hover, form.providers button.feishu:hover { background: var(--panel); }
 
form.providers button.github svg { fill: #181717; }
 
 
button.pending { display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: progress; }
button.pending::after { content: ""; flex: none; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(1turn); } }
.by { margin-top: 40px; text-align: center; font-size: 12px; color: var(--faint); }
@media (max-width: 767px) {
  body { grid-template-columns: 1fr; }
  .brand { display: none; }
  .form { padding: 40px 16px; }
   
  input:not([type=checkbox]) { font-size: 16px; }
   
  input:not([type=checkbox]), button { min-height: 44px; }
}
 
@media (prefers-reduced-motion: reduce) {
  main, .brand .glow { animation: none; }
  *, *::before, *::after { transition-duration: .01ms !important; }
}
</style>
<script>



addEventListener("submit", e => {
  const form = e.target;
  if (form.tagName !== "FORM" || form.querySelector("altcha-widget")) return;
  form.classList.add("pending");
  const button = e.submitter || form.querySelector("button:not([type=button])");
  if (button) button.classList.add("pending");
}, true);

addEventListener("pageshow", () => {
  for (const form of document.querySelectorAll("form.pending")) {
    form.classList.remove("pending");
    for (const button of form.querySelectorAll("button.pending")) button.classList.remove("pending");
  }
});


addEventListener("click", e => {
  const button = e.target.closest("button.reveal");
  if (!button) return;
  const input = button.parentElement.querySelector("input");
  if (!input) return;
  const show = input.type === "password";
  input.type = show ? "text" : "password";
  button.textContent = show ? "隐藏" : "显示";
  button.setAttribute("aria-label", show ? "隐藏密码" : "显示密码");
});


addEventListener("DOMContentLoaded", () => {
  for (const input of document.querySelectorAll('input[maxlength="6"][inputmode="numeric"]')) {
    input.addEventListener("input", () => {
      if (input.value.length !== 6) return;
      const form = input.form;
      form.requestSubmit(form.querySelector('button[value="verify"]') || form.querySelector("button:not([formnovalidate])"));
    });
  }
});
</script>
