<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>退出登录 · Polaris</title>
<style>
 
:root {
  --primary: #2b3f8c; --primary-hover: #1f2f6b; --primary-soft: #eef1fa; --primary-ink: #2b3f8c; --primary-foreground: #fff;
  --canvas: #f3f5f9; --panel: #fff;
  --ink: #161c2d; --muted: #5a6378; --faint: #5a6378; --line: #dde2ec; --danger: #c81e1e;
  --star: #e8ecf6; --shadow-xs: 0 1px 2px rgb(22 28 45 / .06);
  --ring: rgb(43 63 140 / .3);
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --serif: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "Noto Serif SC", STSong, "Iowan Old Style", Georgia, serif;
  font: 14px/1.5 Inter, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--ink); background: var(--panel); color-scheme: light; -webkit-font-smoothing: antialiased;
}
@supports (color: color-mix(in oklab, red, blue)) {
  :root { --ring: color-mix(in oklab, var(--primary) 30%, transparent); }
}
* { box-sizing: border-box; }
 
[hidden] { display: none !important; }
::selection { background: var(--primary-soft); color: var(--ink); }
body { margin: 0; min-height: 100svh; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; background: var(--panel); }
 
.night {
  position: relative; overflow: hidden; min-height: 152px; display: flex; align-items: flex-end; padding: 20px 16px;
  background: #0d1530; color: var(--star);
}
@supports (color: color-mix(in oklab, red, blue)) {
  .night { background: color-mix(in oklab, var(--primary) 34%, #060a17); }
}
.night svg { position: absolute; left: 72%; top: 40%; width: 1400px; height: 1400px; transform: translate(-50%, -50%); pointer-events: none; }
.night .trails { fill: none; stroke: var(--star); stroke-linecap: round; transform-origin: 0 0; animation: turn 480s linear infinite; }
.night .pole { fill: #fff; filter: drop-shadow(0 0 6px rgb(255 255 255 / .8)); }
@keyframes turn { to { transform: rotate(1turn); } }
 
.motto { position: relative; margin: 0; max-width: 12em; font: 400 22px/1.3 var(--serif); letter-spacing: .04em; color: var(--star); text-shadow: 0 0 12px #060a17, 0 0 24px #060a17; }
.side { display: grid; grid-template-rows: auto 1fr auto; gap: 32px; padding: 24px 16px; }
.brand > div { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.brand .mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--primary); color: var(--primary-foreground); }
.brand .mark svg { width: 16px; height: 16px; fill: currentColor; }
.form { align-self: start; width: 100%; max-width: 360px; }
h1 { margin: 0; font-size: 28px; line-height: 1.2; font-weight: 650; letter-spacing: -.02em; }
h1 + p { margin-top: 8px; font-size: 15px; }
p { color: var(--muted); margin: 16px 0; }
form p { margin: 0; }
p b { color: var(--ink); font-weight: 500; }
form { display: grid; gap: 16px; margin-top: 24px; }
label { display: grid; gap: 4px; font-size: 13px; font-weight: 500; }
input, button { font: inherit; font-size: 14px; color: inherit; border-radius: 8px; }
input:not([type=checkbox]) {
  padding: 9px 12px; border: 1px solid var(--line); outline: none; background: var(--panel); box-shadow: var(--shadow-xs);
  transition: border-color .15s, box-shadow .2s var(--ease-out);
}
input:not([type=checkbox]):focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--ring); }
 
input:-webkit-autofill { -webkit-box-shadow: 0 0 0 100px var(--panel) inset; -webkit-text-fill-color: var(--ink); }
 
input[name=code], input[name=totp] { letter-spacing: .3em; font-variant-numeric: tabular-nums; }
button {
  cursor: pointer; padding: 10px 14px; font-weight: 500; border: 0; background: var(--primary); color: var(--primary-foreground);
  transition: background-color .15s, color .15s, border-color .15s, transform .1s;
}
button:not(:disabled):active { transform: translateY(1px); }
button:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); }
button:hover { background: var(--primary-hover); }
a { color: var(--primary-ink); }
form > a { font-size: 13px; justify-self: start; text-decoration: none; }
form > a:hover { text-decoration: underline; }
 
form > button.resend { justify-self: start; padding: 0; background: transparent; color: var(--primary-ink); font-size: 13px; font-weight: 400; }
form > button.resend:hover { background: transparent; text-decoration: underline; }
form > button.resend:disabled { color: var(--faint); text-decoration: none; cursor: default; }
.wait { color: var(--faint); font-variant-numeric: tabular-nums; }
 
.field-group { display: grid; gap: 4px; font-size: 13px; font-weight: 500; }
.field { position: relative; display: block; }
.field input { width: 100%; padding-inline-end: 40px; }
 
.field button.reveal { position: absolute; inset-block: 2px; inset-inline-end: 2px; display: grid; place-items: center; width: 32px; min-height: 0; padding: 0; border-radius: 4px; background: transparent; color: var(--muted); box-shadow: none; }
.field button.reveal:hover { background: var(--primary-soft); color: var(--ink); }
.field button.reveal svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.field button.reveal .off, .field button.reveal.shown .on { display: none; }
.field button.reveal.shown .off { display: block; }
.who { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 8px; background: var(--canvas); overflow-wrap: anywhere; }
.who a { font-size: 13px; flex: none; }
.error { color: var(--danger); font-size: 13px; }
label.agree { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; font-weight: 400; color: var(--muted); }
label.agree a { text-decoration: none; }
label.agree input { margin: 3px 0 0; accent-color: var(--primary); }
altcha-widget { --altcha-border-radius: 8px; --altcha-color-border: var(--line); --altcha-max-width: 100%; }
 
.or { display: flex; align-items: center; gap: 12px; margin: 24px 0 16px; font-size: 12px; color: var(--faint); }
.or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
form.providers { margin-top: 8px; gap: 8px; }
.or + form.providers { margin-top: 0; }
button#passkey-login { display: block; width: 100%; background: var(--panel); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow-xs); }
button#passkey-login:hover { background: var(--canvas); }
form.providers button { background: var(--panel); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow-xs); }
form.providers button:hover { background: var(--canvas); }
 
form.providers button.mark { display: flex; align-items: center; justify-content: center; gap: 8px; }
form.providers button.mark:hover { background: var(--panel); }
form.providers button.mark svg { width: 18px; height: 18px; flex: none; }
 
button.pending { display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: progress; }
button.pending::after { content: ""; flex: none; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(1turn); } }
.by { margin: 0; font-size: 12px; color: var(--faint); }
@media (min-width: 960px) {
  body { grid-template-columns: minmax(440px, 5fr) 6fr; grid-template-rows: none; }
  .night { grid-column: 2; grid-row: 1; position: sticky; top: 0; height: 100svh; padding: 56px; }
  .night svg { left: 58%; top: 34%; }
  .motto { font-size: clamp(28px, 2.6vw, 36px); }
  .side { grid-column: 1; grid-row: 1; padding: 40px clamp(32px, 6vw, 96px); }
  .form { align-self: center; }
}
@media (max-width: 767px) {
   
  input:not([type=checkbox]) { font-size: 16px; }
   
  input:not([type=checkbox]), button { min-height: 44px; }
}
 
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; }
  .night .trails { animation: none; }
}
</style>
<script>



addEventListener("submit", e => {
  const form = e.target;
  if (form.tagName !== "FORM" || form.querySelector("altcha-widget")) return;
  form.classList.add("pending");
  const button = e.submitter || form.querySelector("button:not([type=button])");
  if (button) button.classList.add("pending");
}, true);

addEventListener("pageshow", () => {
  for (const form of document.querySelectorAll("form.pending")) {
    form.classList.remove("pending");
    for (const button of form.querySelectorAll("button.pending")) button.classList.remove("pending");
  }
});


addEventListener("click", e => {
  const button = e.target.closest("button.reveal");
  if (!button) return;
  const input = button.parentElement.querySelector("input");
  if (!input) return;
  const show = input.type === "password";
  input.type = show ? "text" : "password";
  button.classList.toggle("shown", show);
  button.setAttribute("aria-label", show ? "隐藏密码" : "显示密码");
});


addEventListener("DOMContentLoaded", () => {
  for (const input of document.querySelectorAll('input[maxlength="6"][inputmode="numeric"]')) {
    input.addEventListener("input", () => {
      if (input.value.length !== 6) return;
      const form = input.form;
      form.requestSubmit(form.querySelector('button[value="verify"]') || form.querySelector("button:not([formnovalidate])"));
    });
  }
});
</script>
