# Polaris + PostgreSQL behind an existing reverse proxy. Installed to
# /opt/auth by deploy.sh, which also writes /opt/auth/.env on first run.
# The proxy terminates TLS for POLARIS_ISSUER and forwards to port
# POLARIS_PORT (default 8080).

services:
  polaris:
    image: registry.starsdom.com:9443/zibyn/polaris:latest
    restart: unless-stopped
    environment:
      POLARIS_DATABASE_URL: postgres://polaris:${POSTGRES_PASSWORD:?}@postgres:5432/polaris?sslmode=disable
      POLARIS_MASTER_KEY: ${POLARIS_MASTER_KEY:?}
      POLARIS_ISSUER: ${POLARIS_ISSUER:?}
      # A proxy on this host reaches the published port from the network's
      # gateway; a proxy elsewhere comes from its own address.
      POLARIS_TRUSTED_PROXIES: 172.31.254.1,${PROXY_IP:-}
    ports: ["${POLARIS_PORT:-8080}:8080"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: registry.starsdom.com:9443/docker.io/library/postgres:18-alpine # Harbor proxy cache
    restart: unless-stopped
    environment:
      POSTGRES_USER: polaris
      POSTGRES_DB: polaris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker.
    volumes: [pg:/var/lib/postgresql]
    healthcheck:
      test: [CMD, pg_isready, -U, polaris]
      interval: 5s

networks:
  default:
    ipam:
      config: [{ subnet: 172.31.254.0/24, gateway: 172.31.254.1 }]

volumes:
  pg:
