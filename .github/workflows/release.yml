name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # GitHub Release
  packages: write # GHCR

jobs:
  # GHCR makes a new package private: after the first release, set
  # ghcr.io/zibyn/polaris to public once in the package settings.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # Only the Go stage cross-compiles; nothing runs under emulation.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  binaries:
    needs: image # no Release pointing at an image that failed to push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: web
      - name: Build
        run: |
          mkdir dist
          for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${p%/*} arch=${p#*/}
            ext=; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags=-s \
              -o "dist/polaris_${GITHUB_REF_NAME}_${os}_${arch}${ext}" ./cmd/polaris
          done
          cd dist && sha256sum * > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
