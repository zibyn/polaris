# Polaris + PostgreSQL 15 + Caddy (automatic HTTPS). See docs/deploy.md.
#
#   cat > .env <<END
#   POLARIS_DOMAIN=auth.example.com
#   POLARIS_VERSION=0.1.0
#   POLARIS_MASTER_KEY=$(openssl rand -base64 32)
#   POSTGRES_PASSWORD=$(openssl rand -hex 16)
#   END
#   docker compose up -d
#
# BACK UP POLARIS_MASTER_KEY. Losing it makes every encrypted secret
# (signing keys, TOTP secrets, Channel/Provider secrets) unrecoverable.
# Leave POLARIS_DOMAIN unset to try it on https://localhost (Caddy's local CA).

services:
  polaris:
    image: ghcr.io/zibyn/polaris:${POLARIS_VERSION:-latest}
    restart: unless-stopped
    environment:
      POLARIS_DATABASE_URL: postgres://polaris:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/polaris?sslmode=disable
      POLARIS_MASTER_KEY: ${POLARIS_MASTER_KEY:?set in .env}
      POLARIS_ISSUER: https://${POLARIS_DOMAIN:-localhost}
      POLARIS_TRUSTED_PROXIES: 172.31.255.2 # caddy
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: polaris
      POSTGRES_DB: polaris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD, pg_isready, -U, polaris]
      interval: 5s
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      POLARIS_DOMAIN: ${POLARIS_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    networks:
      internal:
        ipv4_address: 172.31.255.2

networks:
  internal:
    ipam:
      # Dynamic IPs come from the upper half, so nothing takes caddy's address.
      config: [{ subnet: 172.31.255.0/24, ip_range: 172.31.255.128/25 }]

volumes:
  pg:
  caddy:
